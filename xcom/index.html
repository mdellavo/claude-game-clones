<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-COM: Crash Site</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet" />
<!-- devkit: fullscreen, FPS counter, debug log. Shared across the games in this repo; keep copies identical
     apart from the config line. Keys: ` (Backquote) FPS counter · Shift+` debug log · F fullscreen (if the game
     does not use F). The ⋯ button (all devices) opens the same three toggles. -->
<style>
#dk-btn{position:fixed;z-index:2147483000;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font:700 16px/1 system-ui,sans-serif;cursor:pointer;opacity:.55;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#dk-btn:hover,#dk-btn:focus-visible{opacity:1}
#dk-menu{position:fixed;z-index:2147483001;top:calc(44px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:10px;background:rgba(10,12,20,.92);border:1px solid rgba(255,255,255,.2);font:600 13px/1.2 system-ui,sans-serif}
#dk-menu button{all:unset;cursor:pointer;color:#fff;padding:8px 12px;border-radius:6px;white-space:nowrap}
#dk-menu button:hover,#dk-menu button:focus-visible{background:rgba(255,255,255,.12)}
#dk-menu button[aria-pressed=true]::after{content:" ✓";color:#7cf}
#dk-fps{position:fixed;z-index:2147483000;left:calc(6px + env(safe-area-inset-left));bottom:calc(6px + env(safe-area-inset-bottom));padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.6);color:#7f7;font:600 11px/1.25 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none}
#dk-log{position:fixed;z-index:2147482999;left:calc(6px + env(safe-area-inset-left));right:calc(6px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));max-height:38vh;display:flex;flex-direction:column;border-radius:6px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#ddd}
#dk-log .dk-bar{display:flex;gap:6px;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.12);align-items:center}
#dk-log .dk-bar span{flex:1;opacity:.7}
#dk-log .dk-bar button{all:unset;cursor:pointer;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff}
#dk-lines{overflow-y:auto;padding:4px 6px;white-space:pre-wrap;word-break:break-word;overscroll-behavior:contain}
#dk-lines .w{color:#fd6}#dk-lines .e{color:#f77}#dk-lines .g{color:#8cf}
#dk-cl{position:fixed;z-index:2147483002;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:rgba(4,6,12,.62)}
#dk-cl .dk-card{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:12px;background:#11141c;color:#e6e9ef;border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.5);font:14px/1.5 system-ui,sans-serif}
#dk-cl .dk-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
#dk-cl .dk-bar b{flex:1;font-size:15px}
#dk-cl .dk-bar button{all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.12)}
#dk-cl .dk-body{overflow-y:auto;padding:4px 16px 16px;overscroll-behavior:contain}
#dk-cl h2,#dk-cl ul,#dk-cl li,#dk-cl p,#dk-cl b,#dk-cl code,#dk-cl a{font-style:normal;font-family:inherit;text-transform:none;letter-spacing:normal;text-shadow:none;background:none;-webkit-text-fill-color:currentColor;transform:none;border:0;box-shadow:none;list-style:disc;text-align:left;line-height:1.5}
#dk-cl h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9fb3c8;margin:16px 0 6px}
#dk-cl ul{margin:0;padding-left:18px}#dk-cl li{margin:0 0 8px}#dk-cl li p{margin:2px 0 0;color:#b8c0cc}
#dk-cl code{font:12px ui-monospace,Menlo,monospace;color:#8cf}#dk-cl a{color:#8cf;text-decoration:underline}#dk-cl .dk-note{color:#9aa4b2}
</style>
<script>
(() => {
  // config: game name for the log header, and whether F is free for fullscreen
  const DK = { game: 'X-COM: Crash Site Recovery', fKey: false };
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const el = (tag, id, html) => { const e = document.createElement(tag); if (id) e.id = id; if (html != null) e.innerHTML = html; return e; };
  const t0 = performance.now(), lines = [], MAX = 400;
  let logEl = null, linesEl = null, fpsEl = null, menuEl = null, btnEl = null;

  // ---- log capture: console.*, uncaught errors, rejected promises, plus game events via DBG.log ----
  const fmt = a => a.map(x => { if (x instanceof Error) return x.stack || x.message; if (typeof x === 'object' && x !== null) { try { return JSON.stringify(x); } catch { return String(x); } } return String(x); }).join(' ');
  function push(level, args) {
    const s = ((performance.now() - t0) / 1000).toFixed(2).padStart(7) + ' ' + fmt(args);
    lines.push([level, s]); if (lines.length > MAX) lines.shift();
    if (linesEl) { const d = document.createElement('div'); d.className = level; d.textContent = s; linesEl.appendChild(d); while (linesEl.childNodes.length > MAX) linesEl.firstChild.remove(); const atEnd = linesEl.scrollHeight - linesEl.scrollTop - linesEl.clientHeight < 40; if (atEnd) linesEl.scrollTop = linesEl.scrollHeight; }
  }
  for (const [m, lv] of [['log', ''], ['info', ''], ['debug', ''], ['warn', 'w'], ['error', 'e']]) { const o = console[m].bind(console); console[m] = (...a) => { push(lv, a); o(...a); }; }
  addEventListener('error', e => push('e', [e.message + (e.filename ? ` (${e.filename.split('/').pop()}:${e.lineno})` : '')]));
  addEventListener('unhandledrejection', e => push('e', ['unhandled rejection:', e.reason]));

  // ---- FPS counter: its own rAF loop, so it measures what the display actually shows ----
  let fpsOn = false, frames = 0, acc = 0, worst = 0, last = 0, raf = 0;
  function fpsLoop(t) {
    raf = requestAnimationFrame(fpsLoop);
    if (last) { const d = t - last; frames++; acc += d; worst = Math.max(worst, d); }
    last = t;
    if (acc >= 500) { fpsEl.textContent = `${Math.round(frames * 1000 / acc)} fps  ${(acc / frames).toFixed(1)} ms  max ${worst.toFixed(0)}`; frames = 0; acc = 0; worst = 0; }
  }
  function setFps(on) {
    fpsOn = on; store.set('devkit.fps', on);
    if (on && !fpsEl) { fpsEl = el('div', 'dk-fps', '-- fps'); document.body.appendChild(fpsEl); last = 0; frames = acc = worst = 0; raf = requestAnimationFrame(fpsLoop); }
    if (!on && fpsEl) { cancelAnimationFrame(raf); fpsEl.remove(); fpsEl = null; }
    syncMenu();
  }
  function setLog(on) {
    store.set('devkit.log', on);
    if (on && !logEl) {
      logEl = el('div', 'dk-log', `<div class="dk-bar"><span>${DK.game} · debug log</span><button type="button" data-a="copy">copy</button><button type="button" data-a="clear">clear</button><button type="button" data-a="close">×</button></div><div id="dk-lines"></div>`);
      linesEl = logEl.querySelector('#dk-lines');
      for (const [lv, s] of lines) { const d = document.createElement('div'); d.className = lv; d.textContent = s; linesEl.appendChild(d); }
      logEl.addEventListener('click', e => { const a = e.target.dataset && e.target.dataset.a; if (a === 'clear') { lines.length = 0; linesEl.textContent = ''; } if (a === 'copy') navigator.clipboard && navigator.clipboard.writeText(lines.map(l => l[1]).join('\n')).catch(() => {}); if (a === 'close') setLog(false); });
      // keep taps and keys on the panel from reaching the game
      for (const ev of ['pointerdown', 'touchstart', 'mousedown', 'wheel']) logEl.addEventListener(ev, e => e.stopPropagation(), { passive: true });
      document.body.appendChild(logEl); linesEl.scrollTop = linesEl.scrollHeight;
    }
    if (!on && logEl) { logEl.remove(); logEl = linesEl = null; }
    syncMenu();
  }

  // ---- fullscreen ----
  const fsEnabled = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  function toggleFs() {
    try {
      if (fsElement()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      const r = document.documentElement; const p = (r.requestFullscreen || r.webkitRequestFullscreen).call(r, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(err => push('w', ['fullscreen refused:', err && err.message]));
    } catch (err) { push('w', ['fullscreen failed:', err && err.message]); }
  }
  // one event only: Chrome fires both fullscreenchange and webkitfullscreenchange, which logged every change twice
  document.addEventListener('onfullscreenchange' in document ? 'fullscreenchange' : 'webkitfullscreenchange', () => { push('g', [fsElement() ? 'entered fullscreen' : 'left fullscreen']); syncMenu(); });

  // ---- docs: CHANGELOG.md and CREDITS.md beside the page (generated by tools/changelog.mjs and tools/credits.mjs) ----
  let clEl = null, clFile = null;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  function renderMd(md) {
    let html = '', open = false;
    for (const line of md.split('\n')) {
      if (/^# /.test(line)) continue;
      if (/^## /.test(line)) { if (open) { html += '</ul>'; open = false; } html += `<h2>${inline(line.slice(3))}</h2>`; }
      else if (/^- /.test(line)) { if (!open) { html += '<ul>'; open = true; } else html += '</li>'; html += `<li>${inline(line.slice(2))}`; }
      else if (/^\s+\S/.test(line) && open) html += `<p>${inline(line.trim())}</p>`;
      else if (line.trim()) { if (open) { html += '</li></ul>'; open = false; } html += `<p class="dk-note">${inline(line)}</p>`; }
    }
    return html + (open ? '</li></ul>' : '');
  }
  // showDoc('CREDITS.md', 'credits') opens a file in the panel; showDoc(null) closes it
  function showDoc(file, label) {
    if (clEl) { clEl.remove(); clEl = null; }
    clFile = file; if (!file) return;
    clEl = el('div', 'dk-cl', `<div class="dk-card" role="dialog" aria-label="${DK.game} ${label}"><div class="dk-bar"><b>${DK.game} · ${label}</b><button type="button" data-a="close">Close</button></div><div class="dk-body"><p class="dk-note">Loading…</p></div></div>`);
    clEl.addEventListener('click', (e) => { if (e.target === clEl || (e.target.dataset && e.target.dataset.a === 'close')) showDoc(null); });
    for (const ev of ['pointerdown', 'touchstart', 'mousedown', 'wheel', 'keydown']) clEl.addEventListener(ev, (e) => { if (ev === 'keydown' && e.key === 'Escape') showDoc(null); e.stopPropagation(); }, { passive: ev !== 'keydown' });
    document.body.appendChild(clEl);
    const panel = clEl, body = clEl.querySelector('.dk-body');
    fetch(file).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then((md) => { if (clEl === panel) body.innerHTML = renderMd(md); })
      .catch((err) => { if (clEl === panel) body.innerHTML = `<p class="dk-note">The ${label} could not be loaded.</p>`; push('w', [label + ':', err && err.message]); });
  }
  const setChangelog = (on) => on ? clFile !== 'CHANGELOG.md' && showDoc('CHANGELOG.md', 'changelog') : showDoc(null);
  const setCredits = (on) => on ? clFile !== 'CREDITS.md' && showDoc('CREDITS.md', 'credits') : showDoc(null);

  // ---- menu ----
  function syncMenu() {
    if (!menuEl) return;
    const b = menuEl.querySelectorAll('button');
    b[0].setAttribute('aria-pressed', !!fsElement()); b[0].hidden = !fsEnabled();
    b[1].setAttribute('aria-pressed', fpsOn); b[2].setAttribute('aria-pressed', !!logEl);
  }
  function toggleMenu(force) {
    const open = force ?? !menuEl;
    if (open && !menuEl) {
      menuEl = el('div', 'dk-menu', '<button type="button">Fullscreen</button><button type="button">FPS counter</button><button type="button">Debug log</button><button type="button">Changelog</button><button type="button">Credits</button>');
      const [a, b, c] = menuEl.querySelectorAll('button');
      a.onclick = () => { toggleFs(); toggleMenu(false); }; b.onclick = () => setFps(!fpsOn); c.onclick = () => setLog(!logEl); menuEl.querySelectorAll('button')[3].onclick = () => { toggleMenu(false); setChangelog(true); }; menuEl.querySelectorAll('button')[4].onclick = () => { toggleMenu(false); setCredits(true); };
      for (const ev of ['pointerdown', 'touchstart', 'mousedown']) menuEl.addEventListener(ev, e => e.stopPropagation(), { passive: true });
      document.body.appendChild(menuEl); syncMenu();
    } else if (!open && menuEl) { menuEl.remove(); menuEl = null; }
  }

  // ---- keys: capture phase so they work whatever the game does with keydown; never while typing ----
  addEventListener('keydown', e => {
    const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (e.code === 'Backquote' && !e.repeat) { e.preventDefault(); e.stopImmediatePropagation(); if (e.shiftKey) setLog(!logEl); else setFps(!fpsOn); }
    else if (DK.fKey && e.code === 'KeyF' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey && fsEnabled()) { e.preventDefault(); e.stopImmediatePropagation(); toggleFs(); }
  }, true);
  addEventListener('pointerdown', e => { if (menuEl && !menuEl.contains(e.target) && e.target !== btnEl) toggleMenu(false); }, true);

  function mount() {
    btnEl = el('button', 'dk-btn', '⋯'); btnEl.type = 'button'; btnEl.title = 'Fullscreen · FPS · debug log';
    btnEl.setAttribute('aria-label', 'Display and debug options');
    btnEl.addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
    for (const ev of ['pointerdown', 'touchstart', 'mousedown']) btnEl.addEventListener(ev, e => e.stopPropagation(), { passive: true });
    document.body.appendChild(btnEl);
    if (store.get('devkit.fps', false)) setFps(true);
    if (store.get('devkit.log', false)) setLog(true);
    push('g', [`${DK.game} loaded · ${innerWidth}×${innerHeight} @${devicePixelRatio}x · ${navigator.userAgent}`]);
  }
  if (document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // game-facing API: DBG.log('event', data) for notable game events; DBG.warn / DBG.error likewise
  window.DBG = { changelog: setChangelog, credits: setCredits, log: (...a) => push('g', a), warn: (...a) => push('w', a), error: (...a) => push('e', a), fps: setFps, logPanel: setLog, fullscreen: toggleFs, mountPoint: () => btnEl };
})();
</script>
<style>
/* devkit placement for X-COM: the battle HUD fills the bottom edge and the touch camera pad (#tpad) sits
   under the ⋯ button, so the FPS readout goes top right beside ⋯ and the menu opens left of the pad. */
#dk-fps{left:auto;bottom:auto;top:calc(14px + env(safe-area-inset-top));right:calc(46px + env(safe-area-inset-right))}
body.touchdev #dk-menu{top:calc(64px + env(safe-area-inset-top));right:calc(106px + env(safe-area-inset-right))}
.topbar{max-width:calc(100% - 62px)}
@media (max-width:600px){
  /* portrait phone: the top bar spans the width, so the readout drops below the camera pad */
  #dk-fps{top:calc(262px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right))}
  /* full-height menu panels start below the ⋯ button */
  .screen{padding-top:calc(30px + env(safe-area-inset-top))}
}
</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  
<style>
#tpad{position:fixed;right:6px;top:calc(56px + env(safe-area-inset-top,0px));z-index:60;display:none;
  grid-template-columns:repeat(2,42px);gap:5px}
body.touchdev.in-battle #tpad{display:grid}
#tpad button{width:44px;height:44px;border:1px solid #4b6b7d;background:rgba(10,24,34,.82);color:#cfe8f5;
  font:700 15px/1 "Silkscreen",monospace;border-radius:4px;touch-action:none}
#tpad button:active{background:#1d5f80;color:#fff}
</style>
<div id="tpad" aria-label="Camera controls">
  <button type="button" data-key="q" aria-label="Rotate left">&#8634;</button>
  <button type="button" data-key="e" aria-label="Rotate right">&#8635;</button>
  <button type="button" data-key="=" aria-label="Zoom in">+</button>
  <button type="button" data-key="-" aria-label="Zoom out">&#8722;</button>
  <button type="button" data-key="]" aria-label="Level up">&#9650;</button>
  <button type="button" data-key="[" aria-label="Level down">&#9660;</button>
  <button type="button" data-key="Tab" aria-label="Next soldier">NXT</button>
  <button type="button" data-key="c" aria-label="Centre on soldier">CTR</button>
</div>
<script>
/* Touch devices have no keyboard, so give the camera and unit cycling real buttons. */
(function () {
  if (!matchMedia('(pointer: coarse)').matches) return;
  document.body.classList.add('touchdev');
  document.getElementById('tpad').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var k = b.dataset.key;
      window.dispatchEvent(new KeyboardEvent('keydown', { key: k, code: k, bubbles: true }));
      window.dispatchEvent(new KeyboardEvent('keyup', { key: k, code: k, bubbles: true }));
    });
  });
})();
</script>
</body>
</html>
